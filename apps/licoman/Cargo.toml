[package]
name = "licoman"
description = "Licoman — Linux Configuration Manager: a universal interface for Linux configuration."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "licoman"
path = "src/main.rs"

[dependencies]
licoman-core = { workspace = true }
licoman-ui = { workspace = true }
gpui-kit = { workspace = true }
# Only for `licoman module schema` (prints the JSON Schema generated in core).
schemars = "1"
serde_json = "1"

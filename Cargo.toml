[workspace]
resolver = "3"
members = ["apps/licoman"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/barscn/licoman"

[workspace.dependencies]
gpui-kit = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

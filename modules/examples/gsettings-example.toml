schema_version = 1
id = "desktop.example.gsettings"
scope = "desktop"
title = "GSettings Example"
description = "The plan's annotated GSettings example. Hidden/read-only unless GNOME and the schema are detected; this build never writes it."
category = "Appearance"
docs_url = "https://docs.gtk.org/gio/class.Settings.html"

[compatibility]
desktops = ["GNOME"]
required_backends = ["gsettings"]

[support]
maintainer = "You"
tested = ["GNOME 45+"]
level = "read_only"

[[settings]]
id = "clock.show_weekday"
title = "Show weekday in clock"
description = "Display the weekday in the top bar clock."
keywords = ["clock", "date", "weekday", "top bar"]
type = "boolean"
control = "switch"
policy = "immediate"
default = true
[settings.backend]
kind = "gsettings"
schema = "org.gnome.desktop.interface"
key = "clock-show-weekday"

[[settings]]
id = "clock.format"
title = "Clock format"
description = "12- or 24-hour clock display."
keywords = ["clock", "time"]
type = "enum"
control = "dropdown"
policy = "immediate"
default = "24h"
[[settings.options]]
value = "24h"
label = "24-hour"
[[settings.options]]
value = "12h"
label = "AM/PM"
[settings.backend]
kind = "gsettings"
schema = "org.gnome.desktop.interface"
key = "clock-format"

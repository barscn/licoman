schema_version = 1
id = "app.mpv"
scope = "application"
title = "MPV"
description = "Player options stored in mpv's documented single configuration file (mpv.conf). Only era-stable top-level options are exposed; everything else stays unclaimed. Writes patch the one line that owns the key and are gated by the detected mpv version (fail-closed)."
category = "Media"
order = 30
docs_url = "https://mpv.io/manual/master/#configuration-files"

[compatibility]
apps = ["mpv.desktop"]
required_backends = ["config:mpv"]

[support]
maintainer = "Licoman maintainers"
tested = ["mpv 0.41.0 on Arch (live reads; --list-options evidence)"]
level = "partial"

[[settings]]
id = "volume"
title = "Startup volume"
description = "Volume level new mpv instances start with. A config value; the running player's own volume changes are not tracked here."
keywords = ["mpv", "volume", "audio", "loudness"]
type = "float"
control = "slider"
default = 100
min = 0
max = 1000
step = 1
unit = "%"
restart = "app"
group = "Playback"
order = 1
[settings.backend]
kind = "file"
path = "mpv/mpv.conf"
format = "mpv_conf"
resolution = "mpv"
key = "volume"

[[settings]]
id = "fullscreen"
title = "Start in fullscreen"
description = "Open every new video in fullscreen mode."
keywords = ["mpv", "fullscreen", "video", "window"]
type = "boolean"
control = "switch"
default = false
restart = "app"
group = "Playback"
order = 2
[settings.backend]
kind = "file"
path = "mpv/mpv.conf"
format = "mpv_conf"
resolution = "mpv"
key = "fullscreen"

[[settings]]
id = "keep_open"
title = "Keep the window open at the end"
description = "Do not close the player when playback of the last file ends."
keywords = ["mpv", "keep open", "window", "playback"]
type = "enum"
control = "dropdown"
default = "no"
restart = "app"
group = "Playback"
order = 3
[[settings.options]]
value = "no"
[[settings.options]]
value = "yes"
[[settings.options]]
value = "always"
[settings.backend]
kind = "file"
path = "mpv/mpv.conf"
format = "mpv_conf"
resolution = "mpv"
key = "keep-open"

[[settings]]
id = "save_position_on_quit"
title = "Save position on quit"
description = "Remember the playback position and offer to resume next time."
keywords = ["mpv", "resume", "position", "quit"]
type = "boolean"
control = "switch"
default = false
restart = "app"
group = "Playback"
order = 4
[settings.backend]
kind = "file"
path = "mpv/mpv.conf"
format = "mpv_conf"
resolution = "mpv"
key = "save-position-on-quit"

schema_version = 1
id = "shared.appearance"
scope = "shared"
title = "Appearance"
description = "Interface appearance. The interface rows bound to GSettings read your desktop's real values (dconf + schema defaults); the rest is served by the mock value source."
category = "Appearance"
order = 10

[support]
maintainer = "Licoman maintainers"
tested = ["Licoman 0.1 mock catalog"]
level = "supported"

[[settings]]
id = "gsettings_color_scheme"
title = "Color scheme (desktop)"
description = "The desktop-wide light/dark preference, read from org.gnome.desktop.interface/color-scheme."
keywords = ["dark", "light", "theme", "gsettings"]
type = "enum"
control = "dropdown"
default = "default"
group = "Interface (read-only)"
order = 0.5
[[settings.options]]
value = "default"
label = "Default"
[[settings.options]]
value = "prefer-dark"
label = "Prefer dark"
[[settings.options]]
value = "prefer-light"
label = "Prefer light"
[settings.backend]
kind = "gsettings"
schema = "org.gnome.desktop.interface"
key = "color-scheme"

[[settings]]
id = "gsettings_animations"
title = "Enable animations (desktop)"
description = "The desktop animation preference, read from org.gnome.desktop.interface/enable-animations."
keywords = ["animations", "effects", "gsettings"]
type = "boolean"
control = "switch"
default = true
group = "Interface (read-only)"
order = 0.6
[settings.backend]
kind = "gsettings"
schema = "org.gnome.desktop.interface"
key = "enable-animations"

[[settings]]
id = "gsettings_cursor_size"
title = "Cursor size (desktop)"
description = "The desktop cursor size, read from org.gnome.desktop.interface/cursor-size."
keywords = ["cursor", "pointer", "gsettings"]
type = "integer"
control = "number"
default = 24
min = 6
max = 96
group = "Interface (read-only)"
order = 0.7
[settings.backend]
kind = "gsettings"
schema = "org.gnome.desktop.interface"
key = "cursor-size"

[[settings]]
id = "text_scaling"
title = "Text scaling"
description = "Scales text across the interface (sample values)."
keywords = ["zoom", "font size"]
type = "enum"
control = "dropdown"
default = "100%"
group = "Fonts and text"
order = 1
[[settings.options]]
value = "90%"
[[settings.options]]
value = "100%"
[[settings.options]]
value = "110%"
[[settings.options]]
value = "125%"
[[settings.options]]
value = "150%"
[settings.backend]
kind = "mock"

[[settings]]
id = "font_size_interface"
title = "Interface font size"
description = "Base font size for interface text."
keywords = ["font"]
type = "float"
control = "slider"
default = 11
min = 8
max = 24
step = 0.5
unit = "pt"
group = "Fonts and text"
order = 2
[settings.backend]
kind = "mock"

[[settings]]
